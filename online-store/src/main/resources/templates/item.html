<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Витрина товаров</title>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="stylesheet" href="/css/app.css">
</head>

<body>
    <div class="header container">
        <a href="/orders" style="float:right;" th:if="${isUser}">
            <b>ЗАКАЗЫ &cudarrr;</b>
        </a>
        <a href="/cart/items" style="float:right;" th:if="${isUser}">
            <b>КОРЗИНА &cudarrr;</b>
        </a>
        <a href="/main/items" style="float:right;">
            <b>ГЛАВНАЯ &cudarrr;</b>
        </a>
        <a href="/logout" style="float:right; margin-right: 12px;" th:if="${isUser}">
            <b>ВЫХОД</b>
        </a>
        <a href="/login" style="float:right; margin-right: 12px;" th:if="${!isUser}">
            <b>ВОЙТИ</b>
        </a>
    </div>
    <div class="container card" style="width:70%;margin-left:auto;margin-right:auto;">
        <p>
            <img width="300" height="300" th:src="${'http://localhost:8080/'+item.getImgPath()}">
        </p>
        <p>
            <b th:text="${item.getTitle()}"></b>
            <b th:text="${item.getPrice()}+' руб.'" style="text-align:right;"></b>
        </p>
        <p>
            <span th:text="${item.getDescription()}"></span>
        </p>
        <form th:action="${'/items/'+item.getId()}" method="post" th:if="${isUser}">
            <button class="btn" name="action" value="minus">-</button>
            <span th:text="${item.getCount()}"></span>
            <button class="btn" name="action" value="plus">+</button>
            <button class="btn primary" name="action" value="plus" th:if="${item.getCount()==0}" style="float:right;">В корзину</button>
        </form>
    </div>
</body>

</html>
